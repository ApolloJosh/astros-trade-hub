name: Trade calibration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Analyze past trades
        run: node src/calibrate-trades.js --months=12
      - name: Save report
        if: always()
        continue-on-error: true
        run: |
          git config user.name trade-hub-bot
          git config user.email actions@github.com
          git add reports data-sources/trade-calibration-cache.json || true
          git commit -m 'trade calibration' || echo 'nothing to commit'
          git push || echo 'push skipped'
