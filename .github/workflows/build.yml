name: Build data & deploy

on:
  schedule:
    - cron: "0 11 * * *"    # daily ~6am CT; tighten near the deadline (e.g. "0 */2 * * *")
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["src/**", "config.json", "data-sources/**", "!data-sources/id-cache.json", "!data-sources/defense.json", "!data-sources/il-history.json", "!data-sources/salaries-cots.json", "docs/**", "!docs/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tests
        run: npm test
      - name: Build data (rosters, values, transactions, calibration)
        run: npm run build
      - name: Commit refreshed data
        run: |
          git config user.name "trade-hub-bot"
          git config user.email "actions@github.com"
          git add docs/data reports data-sources/id-cache.json data-sources/defense.json data-sources/il-history.json data-sources/salaries-cots.json
          git diff --cached --quiet || git commit -m "data refresh $(date -u +%F)"
          git push
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with: { path: docs }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
