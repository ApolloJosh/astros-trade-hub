name: Trade feed

# Deadline-week feed refresh. This is deliberately NOT the full build: it runs
# only src/transactions.js (trade log -> feed.json / traded.json / players.json),
# which takes seconds, so it can run far more often than build.yml without
# hammering the stats APIs or piling up queued runs.
#
# Schedules are date-pinned to 1-3 Aug 2026 and expire on their own. After the
# deadline passes, build.yml's daily 11:00 UTC run keeps the feed current.

on:
  workflow_dispatch: {}
  schedule:
    # GitHub cron is UTC with no DST handling. Central is UTC-5 (CDT) in August.
    # --- Phase 1: hourly, through Sun 4:59pm CT ---
    - cron: "0 * 1 8 *"          # Sat 1 Aug, every hour
    - cron: "0 0-21 2 8 *"       # Sun 2 Aug, 00:00-21:00 UTC (to 4pm CT)
    # --- Phase 2: every 30 min, from Sun 5:00pm CT ---
    - cron: "*/30 22-23 2 8 *"   # Sun 2 Aug, 22:00 UTC = 5pm CT
    - cron: "*/30 0-12 3 8 *"    # Mon 3 Aug, overnight to 7:30am CT
    # --- Phase 3: every 5 min, Mon 8:00am-6:00pm CT (deadline day) ---
    - cron: "*/5 13-22 3 8 *"    # Mon 3 Aug, 13:00 UTC = 8am CT
    - cron: "0 23 3 8 *"         # Mon 3 Aug, 23:00 UTC = 6pm CT, final run

permissions:
  contents: write
  pages: write
  id-token: write

# Feed runs are idempotent, so if one is still going when the next fires,
# drop the older one instead of building a backlog.
concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Refresh trade feed
        run: node src/transactions.js

      # Picks up any tweet URLs pasted into data-sources/reporter-tweets.json.
      # Already-resolved tweets come from cache, so this is one request per new
      # url — cheap enough to run on the 5-minute deadline-day cadence.
      - name: Refresh reporters feed
        continue-on-error: true
        run: node src/fetch-tweets.js

      # Cheap (one request per feed) and stale feeds are withheld by the
      # fetcher itself, so this is safe to run on the deadline-day cadence.
      - name: Refresh league news
        continue-on-error: true
        run: node src/fetch-news.js

      - name: Commit if the feed actually moved
        id: commit
        run: |
          git config user.name trade-hub-bot
          git config user.email actions@github.com
          git add docs/data/feed.json docs/data/traded.json docs/data/players.json \
                  docs/data/reporters.json docs/data/news.json || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new transactions — skipping publish."
          else
            git commit -m 'feed refresh'
            # build.yml pushes to the same branch; rebase rather than fail.
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break || sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Publishing only on a real change keeps Pages deploys down to the number
      # of actual trades rather than one every five minutes.
      - name: Upload site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: docs }

  deploy:
    needs: feed
    if: needs.feed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
