<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Feed — BTD Trade Hub</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.trade{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tdate{font-size:12px;color:var(--muted)}
.vtag{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px}
.vtag.fair{background:#123125;color:var(--good)}
.vtag.edge{background:#3a2a10;color:var(--warn)}
.vtag.lop{background:#3a1a1a;color:var(--bad)}
.vtag.na{background:var(--chip);color:var(--muted)}
.eq{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
@media(max-width:640px){.eq{grid-template-columns:1fr}}
.side h4{margin:0 0 6px;font-size:13px}
.side h4 img{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.pl{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid #1e2027}
.sum{display:flex;justify-content:space-between;font-size:13px;font-weight:800;padding-top:6px}
.eqsign{align-self:center;font-size:22px;color:var(--muted);text-align:center}
.balbar{height:7px;background:#2a2c34;border-radius:99px;overflow:hidden;margin-top:10px;display:flex}
.balbar div{height:100%}
</style>
</head><body><div class="wrap">
<nav id="nav"></nav>
<h1>Trade Feed</h1>
<p class="sub" id="feedsub">Every MLB trade as a value equation — our model's totals per side, with a balance verdict. This is also the data that calibrates the Trade Value formula.</p>
<div id="market" class="card" style="margin-bottom:14px;display:none"></div>
<div id="feed"></div>
<p class="foot">Values from the BTD model at time of refresh · Beyond the Diamond</p>
<script src="assets/app.js"></script>
<script>
BTD.nav('feed');
(async () => {
  try {
    const c = await BTD.data('calibration');
    if (c.tradesAnalyzed) {
      const el = document.getElementById('market'); el.style.display = 'block';
      el.innerHTML = `<b>🌡️ Market temperature: ${c.marketTemp ?? '—'}</b> across ${c.tradesAnalyzed} fully-valued trades ` +
        `(1.0 = model matches market).<br><span class="note">${(c.suggestions || []).map(BTD.esc).join('<br>')}</span>`;
    }
  } catch (e) {}
  const f = await BTD.data('feed');
  document.getElementById('feedsub').innerHTML += ` <b>${f.trades.length}</b> trades since ${f.since}.`;
  const el = document.getElementById('feed');
  if (!f.trades.length) { el.innerHTML = '<div class="card">No trades in the window yet.</div>'; return; }
  el.innerHTML = f.trades.map(t => {
    const [a, b] = t.sides;
    const side = s => `<div class="side"><h4><img src="${BTD.logo(s.teamId)}" onerror="this.style.display='none'">${BTD.esc(s.team)} receive</h4>` +
      s.players.map(p => `<div class="pl"><span>${BTD.esc(p.name)} <span class="chip">${BTD.esc(p.pos || '?')}</span>${p.top100 ? ` <span class="chip t100">MLB #${p.top100}</span>` : p.prospect ? ' <span class="chip pr">PROSPECT</span>' : ''}</span>` +
        `<span class="tv ${BTD.tvCls(p.tv)}">${BTD.pts(p.tv)}</span></div>`).join('') +
      `<div class="sum"><span>Total</span><span class="tv ${BTD.tvCls(s.total)}">${BTD.pts(s.total)}</span></div></div>`;
    const total = (a.total + b.total) || 1;
    return `<div class="trade"><div class="thead"><span class="tdate">${BTD.esc(t.date)}</span>` +
      `<span class="vtag ${t.verdict.cls}">${BTD.esc(t.verdict.label)}${t.ratio != null ? ' · ' + t.ratio + 'x' : ''}</span></div>` +
      `<div class="eq">${side(a)}<div class="eqsign">${t.ratio != null && (t.ratio >= 0.9 && t.ratio <= 1.25) ? '≈' : '≠'}</div>${side(b)}</div>` +
      `<div class="balbar"><div style="width:${a.total / total * 100}%;background:var(--orange)"></div><div style="width:${b.total / total * 100}%;background:#3987e5"></div></div>` +
      `</div>`;
  }).join('');
})().catch(e => { document.getElementById('feed').innerHTML = '<div class="card">No feed data yet — run the pipeline.</div>'; });
</script>
</div></body></html>
