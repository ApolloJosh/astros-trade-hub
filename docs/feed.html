<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Feed — BTD Trade Hub</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.trade{background:var(--card);border:var(--card-line-w) solid var(--card-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tdate{font-size:12px;color:var(--muted)}
.vtag{font-family:var(--hd2);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 12px;border-radius:999px}
.vtag.fair{background:var(--good);color:#fff}
.vtag.edge{background:var(--warn);color:#fff}
.vtag.lop{background:var(--bad);color:#fff}
.vtag.na{background:var(--row-hover);color:var(--muted)}
.eq{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
@media(max-width:640px){.eq{grid-template-columns:1fr}}
.side h4{margin:0 0 6px;font-size:14px;font-family:var(--hd2);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.side h4 img{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.pl{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--row-line)}
.sum{display:flex;justify-content:space-between;font-size:13px;font-weight:800;padding-top:6px}
.eqsign{align-self:center;font-size:22px;color:var(--muted);text-align:center}
.balbar{height:8px;background:var(--row-line);border-radius:99px;overflow:hidden;margin-top:12px;display:flex}
.balbar div{height:100%}
</style>
</head><body>
<header id="mast"></header>
<div class="wrap">
<div class="hero"><div class="kicker">The Wire</div>
<h1>Trade Feed</h1>
<p class="sub" id="feedsub">Every MLB trade as a value equation — our model's totals per side, with a balance verdict. This is also the data that calibrates the Trade Value formula.</p></div>
<div id="market" class="card" style="margin-bottom:14px;display:none"></div>
<div id="feed"></div>
<p class="foot">Values from the BTD model at time of refresh · Beyond the Diamond</p>
<script src="assets/app.js"></script>
<script>
BTD.nav('feed');
(async () => {
  try {
    const c = await BTD.data('calibration');
    if (c.tradesAnalyzed) {
      const el = document.getElementById('market'); el.style.display = 'block';
      el.innerHTML = `<b>🌡️ Market temperature: ${c.marketTemp ?? '—'}</b> across ${c.tradesAnalyzed} fully-valued trades ` +
        `(1.0 = model matches market).<br><span class="note">${(c.suggestions || []).map(BTD.esc).join('<br>')}</span>`;
    }
  } catch (e) {}
  const f = await BTD.data('feed');
  document.getElementById('feedsub').innerHTML += ` <b>${f.trades.length}</b> trades since ${f.since}.`;
  const el = document.getElementById('feed');
  if (!f.trades.length) { el.innerHTML = '<div class="card">No trades in the window yet.</div>'; return; }
  el.innerHTML = f.trades.map(t => {
    const [a, b] = t.sides;
    const side = s => `<div class="side"><h4><img src="${BTD.logo(s.teamId)}" onerror="this.style.display='none'">${BTD.esc(s.team)} receive</h4>` +
      s.players.map(p => `<div class="pl"><span>${BTD.esc(p.name)} <span class="chip">${BTD.esc(p.pos || '?')}</span>${p.top100 ? ` <span class="chip t100">MLB #${p.top100}</span>` : p.prospect ? ' <span class="chip pr">PROSPECT</span>' : ''}${p.crude ? ' <span class="chip">rough est.</span>' : ''}${p.rem != null ? ` <span class="chip">~$${(+p.rem).toFixed(1)}M owed</span>` : ''}</span>` +
        `<span class="tv ${BTD.tvCls(p.tv)}">${BTD.pts(p.tv)}</span></div>`).join('') +
      (s.cashM != null ? `<div class="pl"><span>💵 Cash <span class="chip">$${(+s.cashM).toFixed(1)}M</span></span><span class="tv mid">${(s.cashM * 0.5).toFixed(1)}</span></div>` : '') +
      `<div class="sum"><span>Total</span><span class="tv ${BTD.tvCls(s.total)}">${BTD.pts(s.total)}</span></div></div>`;
    const total = (a.total + b.total) || 1;
    return `<div class="trade"><div class="thead"><span class="tdate">${BTD.esc(t.date)}</span>` +
      `${t.cashUnknown ? '<span class="chip">💵 cash involved — amount unreported</span>' : ''}` +
      `<span class="vtag ${t.verdict.cls}">${BTD.esc(t.verdict.label)}${t.ratio != null ? ' · ' + t.ratio + 'x' : ''}</span></div>` +
      `<div class="eq">${side(a)}<div class="eqsign">${t.ratio != null && (t.ratio >= 0.9 && t.ratio <= 1.25) ? '≈' : '≠'}</div>${side(b)}</div>` +
      `<div class="balbar"><div style="width:${a.total / total * 100}%;background:var(--accent)"></div><div style="width:${b.total / total * 100}%;background:var(--accent2)"></div></div>` +
      `</div>`;
  }).join('');
})().catch(e => { document.getElementById('feed').innerHTML = '<div class="card">No feed data yet — run the pipeline.</div>'; });
</script>
</div></body></html>
