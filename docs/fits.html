<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astros Possible Fits — BTD Trade Hub</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.pcard .top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pcard img.face{width:48px;height:48px;border-radius:50%;background:var(--navy);object-fit:cover}
.pcard .nm{font-weight:700}
.pcard .meta{font-size:11.5px;color:var(--muted)}
.pcard .stats{font-size:12px;background:var(--row-hover);border:1px solid var(--row-line);border-radius:6px;padding:6px 8px;margin:8px 0}
.pcard .vals{display:flex;justify-content:space-between;font-size:12.5px}

/* ---- The Dana Brown Predictor ---- */
.secbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
.secbar .note{margin-left:4px}
.dbhd{font-family:var(--hd);font-size:clamp(17px,2.4vw,22px);text-transform:uppercase;
  letter-spacing:.03em;margin:22px 0 4px;border-bottom:2px solid var(--card-line);padding-bottom:6px}
.dbsub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin:12px 0 4px}
.pbox{background:var(--card);border:var(--card-line-w) solid var(--card-line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:10px 12px;text-align:center}
.pbox span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pbox b{display:block;font-family:var(--hd2);font-size:21px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.pbox b.buy{color:var(--tvhi)} .pbox b.sell{color:var(--accent)}

.tcard{background:var(--card);border:var(--card-line-w) solid var(--card-line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px}
.tchd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;
  border-bottom:1px solid var(--row-line);padding-bottom:8px}
.tchd .tcnum{font-family:var(--hd2);font-weight:800;font-size:13px;color:var(--accent);
  border:2px solid var(--accent);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto}
.tchd .tctitle{font-family:var(--hd2);font-weight:800;font-size:14.5px;letter-spacing:.05em;text-transform:uppercase}
.tchd .tcdate{margin-left:auto;font-size:11.5px;color:var(--muted)}
.tcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:700px){.tcols{grid-template-columns:1fr}}
.tside{min-width:0}
.tshd{display:flex;align-items:center;gap:7px;font-family:var(--hd2);font-weight:800;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px}
.tshd img{width:22px;height:22px;object-fit:contain;flex:0 0 auto}
.tside.hou .tshd{color:var(--accent)}
.pick{display:flex;align-items:center;gap:8px;background:var(--row-hover);border:1px solid var(--card-line);
  border-radius:6px;padding:6px 9px;font-size:12.5px;margin-bottom:6px;min-width:0}
.pick img.face{width:28px;height:28px;border-radius:50%;background:var(--navy);object-fit:cover;flex:0 0 auto}
.pick .pkn{flex:1;min-width:0}
.pick .pkn .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.pick .pkn .m{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .pkv{font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
.ttot{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 9px;margin-top:2px;
  background:var(--row-hover);border:1px solid var(--row-line);border-radius:6px}
.ttot b{font-variant-numeric:tabular-nums}
.tbal{max-width:460px;margin:12px auto 0}
.tbal .blbl{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;color:var(--muted)}
.tbal .bbar{position:relative;height:13px;border:2px solid var(--card-line);border-radius:7px;
  background:var(--navy);overflow:hidden}
.tbal .bfill{height:100%;background:var(--accent)}
.tbal .btick{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.tverd{text-align:center;font-size:11.5px;margin-top:6px;font-weight:700;letter-spacing:.04em}
.tverd.fair{color:var(--tvhi)} .tverd.off{color:var(--warn)}
.tcav{font-size:11.5px;font-style:italic;color:var(--muted);border-left:3px solid var(--warn);
  padding:4px 0 4px 9px;margin-top:9px}
.tprot{font-size:11.5px;color:var(--muted);margin:6px 0 14px}
.tprot b{color:var(--ink)}
/* ---- ApolloJosh's Picks ---- */
.tierhd{display:flex;align-items:center;gap:9px;font-family:var(--hd2);font-size:15px;
  font-weight:800;letter-spacing:.01em;margin:22px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--line)}
.tierhd:first-child{margin-top:4px}
.tierhd span{font-family:inherit;font-size:11px;font-weight:700;color:var(--muted);
  background:var(--chip,rgba(128,128,128,.14));border-radius:999px;padding:2px 8px}
/* full-width dossier card */
.wcard{background:var(--card);border:var(--card-line-w) solid var(--card-line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.wtop{display:flex;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--row-line)}
.wface{width:62px;height:62px;border-radius:50%;background:var(--navy);object-fit:cover;flex:0 0 auto}
.wid{min-width:0}
.wname{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--hd2);
  font-size:19px;font-weight:800;line-height:1.15}
.wtier{font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:1px 8px}
.wmeta{font-size:12px;color:var(--muted);margin-top:3px}
.wawd{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.wvals{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:11px 0 4px}
.wv{background:var(--row-hover);border:1px solid var(--row-line);border-radius:6px;padding:6px 9px;text-align:center}
.wv span{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wv b{display:block;font-family:var(--hd2);font-size:16px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.wgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;margin-top:10px}
@media(max-width:860px){.wgrid{grid-template-columns:1fr;gap:12px}}
.wleft,.wright{min-width:0}
.whd{font-family:var(--hd2);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:10px 0 6px}
.whd:first-child{margin-top:0}
.ytab{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.ytab th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:700;text-align:right;padding:3px 5px;border-bottom:1px solid var(--row-line)}
.ytab th:first-child,.ytab th:nth-child(2),.ytab td:first-child,.ytab td.tm{text-align:left}
.ytab td{padding:4px 5px;text-align:right;border-bottom:1px solid var(--row-line)}
.ytab tr:last-child td{border-bottom:0}
.ytab tr.cur td{font-weight:700;background:var(--row-hover)}
.ytab td.tm{color:var(--muted);font-size:11px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wposrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;margin-bottom:5px}
.wposrow b{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:48px}
.wcard.wmiss{opacity:.5;padding:11px 16px}
.wcard.wmiss .wname{text-decoration:line-through;text-decoration-thickness:1px;font-size:16px}
</style>
</head><body>
<header id="mast"></header>
<div class="wrap">
<div class="hero"><div class="kicker">The Shopping List</div>
<h1>Astros Possible Fits</h1>
<p class="sub">The curated target board from the podcast's tracking sheet — lefty bats and bullpen arms that fit Houston, with model values.</p></div>
<div class="secbar">
  <button id="secBoard" class="on">Target Board</button>
  <button id="secDB">The Dana Brown Predictor</button>
  <button id="secPicks">ApolloJosh's Picks</button>
</div>

<div id="board">
<div class="controls">
  <button data-f="all" class="on">All</button><button data-f="H">Hitters</button><button data-f="P">Pitchers</button>
  <input id="q" placeholder="Search…">
  <select id="sort"><option value="tv">Sort: Trade value</option><option value="tl">Sort: Trade likelihood</option><option value="name">Sort: Name</option></select>
</div>
<div class="grid" id="cards"></div>
</div>

<div id="db" style="display:none"></div>

<div id="picks" style="display:none">
<div class="controls">
  <button data-pf="all" class="on">All</button><button data-pf="H">Hitters</button><button data-pf="P">Pitchers</button>
  <input id="pq" placeholder="Search…">
  <select id="psort"><option value="tier">Sort: Tier order</option><option value="war">Sort: WAR</option><option value="proj">Sort: Proj WAR</option><option value="age">Sort: Youngest</option><option value="name">Sort: Name</option></select>
</div>
<div id="picksbody"></div>
</div>

<p class="foot">Curated in Google Sheets · valued by the BTD model · Beyond the Diamond</p>
<script src="assets/app.js"></script>
<script>
BTD.nav('fits');
(async () => {
  const doc = await BTD.data('fits');
  const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; };
  const players = doc.fits.map(o => ({
    name: (o['Player'] || '').trim(), team: o['Team'] || '', pos: o['Pos'] || '', type: o._type,
    age: num(o['Age']), ctrl: num(o['Control']), tv: num(o['Trade Value']), tl: num(o['Trade Likelihood']),
    tlt: o['TL Tier'] || '', sur: num(o['Surplus $M']), war: num(o['WAR']), proj: num(o['Proj WAR']),
    id: num(o['MLBID']),
    line: o._type === 'H'
      ? `${o['AVG'] || '—'} AVG · ${o['OPS'] || '—'} OPS · ${o['HR'] || 0} HR · ${o['SB'] || 0} SB`
      : `${o['ERA'] || '—'} ERA · ${o['WHIP'] || '—'} WHIP · ${o['K'] || 0} K · ${o['IP'] || 0} IP`,
  })).filter(p => p.name);
  const S = { f: 'all', q: '', sort: 'tv' };
  function render() {
    const el = document.getElementById('cards');
    let list = players.filter(p => (S.f === 'all' || p.type === S.f) && (!S.q || p.name.toLowerCase().includes(S.q)));
    list.sort((a, b) => S.sort === 'name' ? a.name.localeCompare(b.name)
      : S.sort === 'tl' ? (b.tl || 0) - (a.tl || 0) : (b.tv || 0) - (a.tv || 0));
    el.innerHTML = list.map(p => `<div class="card pcard">
      <div class="top"><img class="face" loading="lazy" src="${BTD.shot(p.id)}" onerror="this.style.visibility='hidden'">
      <div><div class="nm">${p.id ? `<span class="pn" data-pid="${p.id}">${BTD.esc(p.name)}</span>` : BTD.esc(p.name)}</div><div class="meta">${BTD.esc([p.team, p.pos, p.age ? 'age ' + p.age : '', p.ctrl != null ? p.ctrl + 'y ctrl' : ''].filter(Boolean).join(' · '))}</div></div></div>
      <div class="stats">${BTD.esc(p.line)}</div>
      <div class="vals"><span>Trade value <b class="tv ${BTD.tvCls(p.tv)}">${BTD.pts(p.tv)}</b></span>
      <span>Likelihood <b>${p.tl ?? '—'}${p.tlt ? ' · ' + BTD.esc(p.tlt) : ''}</b></span></div>
    </div>`).join('') || '<div class="card">No players match.</div>';
  }
  document.querySelectorAll('button[data-f]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('button[data-f]').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); S.f = b.dataset.f; render();
  }));
  document.getElementById('q').addEventListener('input', e => { S.q = e.target.value.toLowerCase(); render(); });
  document.getElementById('sort').addEventListener('change', e => { S.sort = e.target.value; render(); });
  render();
})().catch(e => { document.getElementById('cards').innerHTML = '<div class="card">No fits data yet — run the pipeline.</div>'; });

// ---------- The Dana Brown Predictor ----------
(async () => {
  const el = document.getElementById('db');
  const esc = BTD.esc, pts = BTD.pts;
  let D;
  try { D = await BTD.data('dana-brown'); } catch (e) {
    el.innerHTML = '<div class="card">The predictor is warming up — check back shortly.</div>'; return;
  }
  const HOU = 117;
  const nick = t => String(t || '').replace(/^(Los Angeles|New York|San Francisco|San Diego|St\. Louis|Kansas City|Tampa Bay|Chicago|Washington|Baltimore|Philadelphia|Pittsburgh|Cincinnati|Cleveland|Milwaukee|Minnesota|Colorado|Arizona|Toronto|Boston|Detroit|Houston|Seattle|Texas|Miami|Atlanta|Oakland|Athletics)\s*/, '') || t;

  function chips(p) {
    let b = '';
    if (p.top100) b += ` <span class="chip t100">MLB #${p.top100}</span>`;
    else if (p.orgRank) b += ` <span class="chip pr">Org #${p.orgRank}</span>`;
    else if (p.prospect) b += ' <span class="chip pr">PROSPECT</span>';
    return b;
  }
  const meta = p => [p.pos, p.bt, p.age != null ? 'age ' + p.age : '',
    p.ctrl != null ? p.ctrl + 'y ctrl' : '', p.rem != null ? '~$' + (+p.rem).toFixed(1) + 'M owed' : '',
    p.prospect && p.level && p.level !== 'MLB' ? p.level : ''].filter(Boolean).join(' · ');

  const row = p => `<div class="pick">
    <img class="face" loading="lazy" src="${BTD.shot(p.id)}" onerror="this.style.visibility='hidden'">
    <div class="pkn"><div class="n">${p.id ? `<span class="pn" data-pid="${p.id}">${esc(p.name)}</span>` : esc(p.name)}${chips(p)}</div>
    <div class="m">${esc(meta(p))}</div></div>
    <b class="pkv tv ${BTD.tvCls(p.tv)}">${pts(p.tv)}</b></div>`;

  const side = (label, teamId, players, total, isHou) => `<div class="tside${isHou ? ' hou' : ''}">
    <div class="tshd"><img src="${BTD.logo(teamId)}" alt="" onerror="this.style.display='none'"><span>${esc(label)} receive</span></div>
    ${players.map(row).join('') || '<div class="pick"><div class="pkn"><div class="m">—</div></div></div>'}
    <div class="ttot"><span>Total value</span><b class="tv ${BTD.tvCls(total)}">${pts(total)}</b></div></div>`;

  // Orange = what Houston gives up, navy = what comes back. Tick marks even.
  function bar(send, get) {
    const t = (send || 0) + (get || 0);
    const w = t > 0 ? Math.max(2, Math.min(98, 100 * send / t)) : 50;
    const gap = (get || 0) - (send || 0);
    const fair = Math.abs(gap) <= 12;
    const verdict = Math.abs(gap) < 2 ? 'Dead even'
      : gap > 0 ? `Astros come out ahead by ${pts(Math.abs(gap))}`
      : `Astros pay a premium of ${pts(Math.abs(gap))}`;
    return `<div class="tbal"><div class="blbl"><span>Astros send <b>${pts(send)}</b></span><span><b>${pts(get)}</b> Astros receive</span></div>
      <div class="bbar"><div class="bfill" style="width:${w}%"></div><div class="btick"></div></div>
      <div class="tverd ${fair ? 'fair' : 'off'}">${verdict}${fair ? ' · inside the fair band' : ''}</div></div>`;
  }

  const P = D.profile || {};
  // Guard on the raw value, not the formatted one — otherwise a missing stat
  // renders as "undefined%".
  const box = (l, v, fmt, cls) => (v == null || v === '') ? ''
    : `<div class="pbox"><span>${l}</span><b class="${cls || ''}">${fmt ? fmt(v) : v}</b></div>`;
  const pct = v => v + '%';
  const yrs = (D.years || []).join(' · ');

  const H = [];
  H.push(`<div class="dbhd">The Dana Brown Predictor</div>`);
  H.push(`<p class="dbsub">What Houston's GM has actually done at the deadline — every trade, with what each side gave up — and the deals that same pattern points to this year.</p>`);

  H.push(`<div class="pgrid">
    ${box('Deadline verdict', P.trades ? (P.buyer ? 'BUYER' : 'SELLER') : null, null, P.buyer ? 'buy' : 'sell')}
    ${box('Net value', P.netValue, v => (v > 0 ? '+' : '') + pts(v))}
    ${box('Deadline trades', P.trades)}
    ${box('Avg piece added', P.avgGet, pts)}
    ${box('Buys pitching', P.boughtPitching, pct)}
    ${box('Buys rentals', P.boughtRentals, pct)}
    ${box('Pays w/ prospects', P.paidProspects, pct)}
  </div>`);
  const big = [];
  if (P.biggestGet) big.push(`Biggest add: <b>${esc(P.biggestGet.name)}</b> (${pts(P.biggestGet.tv)})`);
  if (P.biggestGive) big.push(`Biggest cost: <b>${esc(P.biggestGive.name)}</b> (${pts(P.biggestGive.tv)})`);
  if (big.length) H.push(`<p class="tprot">${big.join(' &nbsp;·&nbsp; ')}</p>`);

  // ---- history ----
  H.push(`<div class="dbhd">Every Deadline Trade</div>`);
  H.push(`<p class="dbsub">${yrs ? yrs + ' · ' : ''}values are what each player was worth at the time of the deal.</p>`);
  if (!(D.history || []).length) H.push('<div class="card">No deadline trades on file yet.</div>');
  (D.history || []).forEach(t => {
    H.push(`<div class="tcard">
      <div class="tchd"><span class="tctitle">Astros ⇄ ${esc(nick(t.partner))}</span><span class="tcdate">${esc(t.date || '')}</span></div>
      <div class="tcols">
        ${side('Astros', HOU, t.got.players, t.got.total, true)}
        ${side(nick(t.partner), t.partnerId, t.gave.players, t.gave.total, false)}
      </div>
      ${bar(t.gave.total, t.got.total)}
    </div>`);
  });

  // ---- predictions ----
  H.push(`<div class="dbhd">Deals He'd Make This Year</div>`);
  H.push(`<p class="dbsub">Built off that same pattern — his value band, the prospects he actually spends, and what Houston needs${D.needs && D.needs.length ? ' (' + esc(D.needs.join(', ')) + ')' : ''} — matched against clubs that are selling${D.market && D.market.sellerCount ? ' (' + D.market.sellerCount + ' of them right now)' : ''}.</p>`);
  if ((D.protected || []).length) H.push(`<p class="tprot">Off the table: <b>${esc(D.protected.join(' · '))}</b></p>`);
  if (!(D.predictions || []).length) H.push('<div class="card">No matches on the board right now.</div>');
  (D.predictions || []).forEach((m, i) => {
    const t = m.target;
    H.push(`<div class="tcard">
      <div class="tchd"><span class="tcnum">${i + 1}</span><span class="tctitle">${esc(t.name)} to Houston</span>
        <span class="tcdate">${esc(nick(t.team))}</span></div>
      <div class="tcols">
        ${side('Astros', HOU, [t], t.tv, true)}
        ${side(nick(t.team), t.teamId, m.pkg, m.give, false)}
      </div>
      ${bar(m.give, t.tv)}
      ${(m.caveats || []).map(c => `<div class="tcav">${esc(c)}</div>`).join('')}
    </div>`);
  });

  // ---- contract swaps ----
  if ((D.swaps || []).length) {
    H.push(`<div class="dbhd">Contract-for-Contract Swaps</div>`);
    H.push(`<p class="dbsub">Money out, a need filled — one bad deal traded for another that fits better.</p>`);
    D.swaps.forEach(sw => {
      H.push(`<div class="tcard">
        <div class="tchd"><span class="tctitle">${esc(sw.ours.name)} ⇄ ${esc(sw.theirs.name)}</span>
          <span class="tcdate">${esc(nick(sw.theirs.team))}</span></div>
        <div class="tcols">
          ${side('Astros', HOU, [sw.theirs], sw.theirs.tv, true)}
          ${side(nick(sw.theirs.team), sw.theirs.teamId, [sw.ours], sw.ours.tv, false)}
        </div>
        ${bar(sw.ours.tv, sw.theirs.tv)}
      </div>`);
    });
  }

  H.push(`<p class="foot">Trade history via MLB transactions · values from the BTD model · updated ${D.updated ? new Date(D.updated).toLocaleDateString() : '—'}</p>`);
  el.innerHTML = H.join('');
})().catch(e => {
  document.getElementById('db').innerHTML = '<div class="card">The predictor hit a snag: ' + BTD.esc(e && e.message || e) + '</div>';
});

// ---------- ApolloJosh's Picks ----------
// Full-width dossier cards: bio + valuation up top, last four seasons and
// position history on the left, Savant percentiles down the right. The list
// itself (names + tiers) lives in data/target-board.json. Valuation comes from
// players.json; career lines and position games come from the MLB StatsAPI,
// fetched per card as it scrolls into view so the page still opens fast.
(async () => {
  const el = document.getElementById('picksbody');
  let tb, pdoc;
  try { [tb, pdoc] = await Promise.all([BTD.data('target-board'), BTD.data('players')]); }
  catch (e) { el.innerHTML = '<div class="card">Picks list not loaded yet.</div>'; return; }
  const poolAll = pdoc.players || [];
  const SEASON = pdoc.season || new Date().getFullYear();
  const YEARS = 4;
  const AW = { MVP: 'MVP', CY: 'Cy Young', ROY: 'ROY', GG: 'Gold Glove', SS: 'Silver Slugger', AS: 'All-Star' };

  const idx = new Map(), byId = new Map();
  poolAll.forEach(p => { idx.set(String(p.name).trim().toLowerCase(), p); byId.set(p.id, p); });
  const find = o => {
    for (const n of [o.Player, ...(o.Alt || [])]) {
      const hit = idx.get(String(n).trim().toLowerCase());
      if (hit) return hit;
    }
    return null;
  };

  // ---- MLB StatsAPI ----------------------------------------------------
  // A traded player gets one row per club PLUS a combined row (numTeams set).
  // Keep the combined row for the stat table so a mid-season move doesn't
  // double-count, but use the per-club rows for position games.
  const API = 'https://statsapi.mlb.com/api/v1/people/';
  const cache = new Map();
  function dedupe(splits) {
    const by = new Map();
    (splits || []).forEach(s => {
      const cur = by.get(s.season);
      if (!cur || (s.numTeams && !cur.numTeams)) by.set(s.season, s);
    });
    return [...by.values()].sort((a, b) => b.season - a.season);
  }
  function positions(splits) {
    const career = new Map(), now = new Map();
    (splits || []).forEach(s => {
      if (s.numTeams) return;
      const ab = s.position && s.position.abbreviation; if (!ab) return;
      const g = +(s.stat && s.stat.games) || 0; if (!g) return;
      career.set(ab, (career.get(ab) || 0) + g);
      if (+s.season === +SEASON) now.set(ab, (now.get(ab) || 0) + g);
    });
    const fmt = m => [...m.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => k + ' ' + v);
    return { career: fmt(career), now: fmt(now) };
  }
  function detail(p) {
    if (cache.has(p.id)) return cache.get(p.id);
    const g = p.type === 'H' ? 'hitting' : 'pitching';
    const j = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
    const pr = (async () => {
      const [a, b] = await Promise.all([
        j(API + p.id + '/stats?stats=yearByYear&group=' + g),
        p.type === 'H' ? j(API + p.id + '/stats?stats=yearByYear&group=fielding') : null,
      ]);
      const sa = a && a.stats && a.stats[0] && a.stats[0].splits;
      const sb = b && b.stats && b.stats[0] && b.stats[0].splits;
      return { years: dedupe(sa).slice(0, YEARS), pos: positions(sb) };
    })();
    cache.set(p.id, pr);
    return pr;
  }

  const HCOLS = [['G','gamesPlayed'],['PA','plateAppearances'],['AVG','avg'],['OBP','obp'],['SLG','slg'],
    ['OPS','ops'],['HR','homeRuns'],['RBI','rbi'],['SB','stolenBases'],['BB','baseOnBalls'],['K','strikeOuts']];
  const PCOLS = [['G','gamesPlayed'],['GS','gamesStarted'],['IP','inningsPitched'],['W','wins'],['L','losses'],
    ['ERA','era'],['WHIP','whip'],['K','strikeOuts'],['BB','baseOnBalls'],['HR','homeRuns']];
  function yearsTable(p, years) {
    if (!years || !years.length) return '<div class="ppnote">No MLB seasons on file.</div>';
    const cols = p.type === 'H' ? HCOLS : PCOLS;
    const tm = s => s.numTeams ? s.numTeams + ' tms' : (s.team && s.team.name ? s.team.name.split(' ').pop() : '—');
    return '<table class="ytab"><thead><tr><th>Yr</th><th>Tm</th>' +
      cols.map(c => '<th>' + c[0] + '</th>').join('') + '</tr></thead><tbody>' +
      years.map(s => '<tr' + (+s.season === +SEASON ? ' class="cur"' : '') + '>' +
        '<td>' + String(s.season).slice(2) + '</td><td class="tm">' + BTD.esc(tm(s)) + '</td>' +
        cols.map(c => '<td>' + BTD.esc(s.stat && s.stat[c[1]] != null ? s.stat[c[1]] : '—') + '</td>').join('') +
        '</tr>').join('') + '</tbody></table>';
  }
  function posHTML(p, pos) {
    if (p.type !== 'H') return '<div class="ppnote">Pitcher — ' + BTD.esc(p.pos || 'P') + '</div>';
    if (!pos || (!pos.career.length && !pos.now.length)) return '<div class="ppnote">No fielding record on file.</div>';
    const line = (lbl, arr) => arr.length
      ? '<div class="wposrow"><b>' + lbl + '</b>' + arr.map(x => '<span class="chip">' + BTD.esc(x) + '</span>').join('') + '</div>'
      : '';
    return line(SEASON, pos.now) + line('Career', pos.career);
  }

  const S = { f: 'all', q: '', sort: 'tier' };
  function card(o) {
    const p = find(o);
    if (!p) return '<div class="wcard wmiss"><div class="wname">' + BTD.esc(o.Player) + '</div>' +
      '<div class="wmeta">' + BTD.esc(o.TierShort) + ' · not carried in the model data</div></div>';
    const owed = p.rem != null ? '~$' + (+p.rem).toFixed(1) + 'M owed' + (p.salEst ? ' (est.)' : '') : '';
    const bio = [p.team, p.pos, p.bt, p.age ? 'age ' + p.age : '',
      p.ctrl != null ? p.ctrl + 'y control' : '',
      p.salM != null ? '$' + (+p.salM).toFixed(1) + 'M/yr' : '', owed].filter(Boolean).join(' · ');
    const awards = (p.awards || []).map(a =>
      '<span class="chip awd">🏆 ' + (AW[a.t] || a.t) + ' ’' + String(a.s).slice(2) + '</span>').join('');
    const vb = (l, v, cls) => v == null ? '' :
      '<div class="wv"><span>' + l + '</span><b class="' + (cls || '') + '">' + v + '</b></div>';
    return '<div class="wcard" data-pid="' + p.id + '">' +
      '<div class="wtop"><img class="wface" loading="lazy" src="' + BTD.shot(p.id) + '" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="wid"><div class="wname"><span class="pn" data-pid="' + p.id + '">' + BTD.esc(p.name) + '</span>' +
      BTD.badge(p) + '<span class="wtier">' + BTD.esc(o.TierShort) + '</span></div>' +
      '<div class="wmeta">' + BTD.esc(bio) + '</div>' +
      (awards ? '<div class="wawd">' + awards + '</div>' : '') + '</div></div>' +
      // Trade value is deliberately omitted here — the model's numbers are
      // still being evaluated, so this board shows scouting data only.
      '<div class="wvals">' +
        vb('WAR', p.war) + vb('Proj WAR', p.proj) +
        vb('Def (FRV)', p.def != null ? (p.def > 0 ? '+' : '') + p.def : null) +
        vb('IL · 4yr', p.ilDays != null ? p.ilDays + 'd / ' + (p.ilStints || 0) : null) +
      '</div>' +
      '<div class="wgrid"><div class="wleft">' +
        '<div class="whd">Last ' + YEARS + ' seasons</div>' +
        '<div class="wyears"><div class="ppload">Loading seasons…</div></div>' +
        '<div class="whd">Positions played</div>' +
        '<div class="wpos"><div class="ppload">Loading…</div></div>' +
      '</div><div class="wright">' +
        (BTD.barsHTML(p, poolAll) || '<div class="ppnote">No Statcast data on file.</div>') +
      '</div></div></div>';
  }

  let io = null;
  function hydrate() {
    if (io) io.disconnect();
    if (!('IntersectionObserver' in window)) {
      el.querySelectorAll('.wcard[data-pid]').forEach(fill);
      return;
    }
    io = new IntersectionObserver(ents => ents.forEach(en => {
      if (!en.isIntersecting) return;
      io.unobserve(en.target); fill(en.target);
    }), { rootMargin: '400px' });
    el.querySelectorAll('.wcard[data-pid]').forEach(n => io.observe(n));
  }
  async function fill(node) {
    const p = byId.get(+node.dataset.pid); if (!p) return;
    let d;
    try { d = await detail(p); } catch (e) { d = { years: [], pos: null }; }
    const y = node.querySelector('.wyears'), ps = node.querySelector('.wpos');
    if (y) y.innerHTML = yearsTable(p, d.years);
    if (ps) ps.innerHTML = posHTML(p, d.pos);
  }

  const keep = o => {
    if (S.q && !String(o.Player).toLowerCase().includes(S.q)) return false;
    if (S.f === 'all') return true;
    const p = find(o); if (!p) return false;
    return S.f === 'H' ? p.type === 'H' : p.type !== 'H';
  };
  // Missing values sort last in either direction, so an unmodeled name never
  // jumps the queue just because the field is blank.
  const val = (o, k, miss) => { const p = find(o); return p && p[k] != null ? +p[k] : miss; };
  function render() {
    const H = [];
    if (S.sort === 'tier') {
      tb.tiers.forEach(t => {
        const rows = tb.board.filter(o => o.Tier === t.key && keep(o));
        if (!rows.length) return;
        H.push('<div class="tierhd">' + BTD.esc(t.label) + '<span>' + rows.length + '</span></div>');
        H.push(rows.map(card).join(''));
      });
    } else {
      const asc = S.sort === 'age';
      const rows = tb.board.filter(keep).sort((a, b) => S.sort === 'name'
        ? String(a.Player).localeCompare(String(b.Player))
        : asc ? val(a, S.sort, 999) - val(b, S.sort, 999)
              : val(b, S.sort, -1) - val(a, S.sort, -1));
      H.push(rows.map(card).join(''));
    }
    el.innerHTML = H.join('') || '<div class="card">No picks match.</div>';
    hydrate();
  }
  document.querySelectorAll('button[data-pf]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('button[data-pf]').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); S.f = b.dataset.pf; render();
  }));
  document.getElementById('pq').addEventListener('input', e => { S.q = e.target.value.toLowerCase(); render(); });
  document.getElementById('psort').addEventListener('change', e => { S.sort = e.target.value; render(); });
  render();
})().catch(e => { document.getElementById('picksbody').innerHTML = '<div class="card">Picks hit a snag: ' + BTD.esc(e && e.message || e) + '</div>'; });

// section switcher
(function () {
  const SEC = [
    { btn: 'secBoard', pane: 'board', hash: '' },
    { btn: 'secDB',    pane: 'db',    hash: '#predictor' },
    { btn: 'secPicks', pane: 'picks', hash: '#picks' },
  ];
  function show(pane) {
    SEC.forEach(s => {
      const on = s.pane === pane;
      document.getElementById(s.pane).style.display = on ? '' : 'none';
      document.getElementById(s.btn).classList.toggle('on', on);
      if (on) history.replaceState(null, '', s.hash || location.pathname);
    });
  }
  SEC.forEach(s => document.getElementById(s.btn).addEventListener('click', () => show(s.pane)));
  const hit = SEC.find(s => s.hash && s.hash === location.hash);
  if (hit) show(hit.pane);
})();
</script>
</div></body></html>
